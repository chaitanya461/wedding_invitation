<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Royal Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royalGold: '#D4AF37',
                        goldLight: '#F3E5AB',
                        goldDark: '#996515',
                        crimson: '#7A1515',
                        crimsonDeep: '#4A0808',
                        ivory: '#FDF6E3',
                        ivoryWarm: '#F7E7CE',
                    },
                    fontFamily: {
                        cinzel: ['"Cinzel Decorative"', 'serif'],
                        cormorant: ['"Cormorant Garamond"', 'serif'],
                        script: ['"Great Vibes"', 'cursive'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Royal Animations & Ornate Textures */
        :root {
            --gold: #D4AF37;
            --gold-bright: #FCE28B;
            --crimson: #7A1515;
            --crimson-dark: #420707;
            --ivory: #FDF6E3;
        }

        body {
            background-color: var(--ivory);
            color: #3B1810;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Damask / Palace Wall Subtle Pattern */
        .palace-pattern {
            background-color: #FDF6E3;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 70%),
                repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.04) 0px, rgba(212, 175, 55, 0.04) 2px, transparent 2px, transparent 12px),
                repeating-linear-gradient(-45deg, rgba(212, 175, 55, 0.04) 0px, rgba(212, 175, 55, 0.04) 2px, transparent 2px, transparent 12px);
        }

        /* Metallic Gold Shimmer Text */
        .gold-foil-text {
            background: linear-gradient(135deg, #8A6012 0%, #D4AF37 25%, #FFF2B2 50%, #C59B27 75%, #7E530A 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        .gold-foil-light {
            background: linear-gradient(135deg, #D4AF37 0%, #FFF5C3 40%, #F1C94B 60%, #B8860B 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Opening Royal Gates / Curtains */
        .gate-left, .gate-right {
            transition: transform 1.6s cubic-bezier(0.77, 0, 0.175, 1);
            will-change: transform;
        }
        .gates-opened .gate-left {
            transform: translateX(-102%);
        }
        .gates-opened .gate-right {
            transform: translateX(102%);
        }
        .gates-opened .seal-container {
            opacity: 0;
            transform: scale(1.3);
            pointer-events: none;
            transition: all 0.7s ease-out;
        }

        /* Velvet Curtain Fold Texture */
        .velvet-crimson {
            background: 
                repeating-linear-gradient(
                    90deg,
                    rgba(0,0,0,0.28) 0px,
                    rgba(255,255,255,0.04) 18px,
                    rgba(0,0,0,0.35) 36px
                ),
                radial-gradient(circle at center, #8C1919 0%, #480707 100%);
        }

        /* Swaying Bells & Garlands */
        @keyframes swayBell {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }
        @keyframes swayBellSlow {
            0%, 100% { transform: rotate(3deg); }
            50% { transform: rotate(-3deg); }
        }
        .bell-sway {
            transform-origin: top center;
            animation: swayBell 3.4s ease-in-out infinite;
        }
        .bell-sway-alt {
            transform-origin: top center;
            animation: swayBellSlow 4.1s ease-in-out infinite;
        }

        /* Flickering Diya Flame */
        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-1deg); opacity: 0.95; }
            25% { transform: scale(1.06, 0.96) rotate(2deg); opacity: 1; }
            50% { transform: scale(0.95, 1.05) rotate(-2deg); opacity: 0.88; }
            75% { transform: scale(1.04) rotate(1deg); opacity: 0.98; }
        }
        .diya-flame {
            transform-origin: bottom center;
            animation: flicker 1.8s infinite ease-in-out;
        }

        /* Staggered Reveal Animations */
        .reveal-item {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .invitation-active .reveal-item {
            opacity: 1;
            transform: translateY(0);
        }
        .delay-100 { transition-delay: 0.2s; }
        .delay-200 { transition-delay: 0.45s; }
        .delay-300 { transition-delay: 0.7s; }
        .delay-400 { transition-delay: 0.95s; }
        .delay-500 { transition-delay: 1.2s; }
        .delay-600 { transition-delay: 1.45s; }

        /* Floating Rose Petals Canvas */
        #petal-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 30;
        }

        /* Ornate Gold Border Frame */
        .royal-card-border {
            border: 2px solid #D4AF37;
            box-shadow: 
                0 15px 40px -10px rgba(74, 8, 8, 0.25),
                inset 0 0 0 5px #FDF6E3,
                inset 0 0 0 6px rgba(212, 175, 55, 0.5);
        }

        /* Pulse Ring for Wax Seal */
        @keyframes pulseGold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.75); }
            70% { box-shadow: 0 0 0 22px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        .seal-pulse {
            animation: pulseGold 2.2s infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #FDF6E3; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 999px; }
    </style>
</head>
<body class="palace-pattern font-cormorant antialiased selection:bg-royalGold/30 selection:text-crimson">

    <!-- Floating Rose Petals Canvas -->
    <canvas id="petal-canvas"></canvas>

    <!-- ===================================================================== -->
    <!-- 1. GRAND OPENING ROYAL GATE / CURTAIN SCREEN                          -->
    <!-- ===================================================================== -->
    <div id="opening-overlay" class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden">

        <!-- Center Mandala Wax Seal Button & Preview Crest -->
        <div class="seal-container absolute inset-0 flex flex-col items-center justify-center z-10 px-4 text-center pointer-events-auto">
            <div class="mb-6 bg-crimsonDeep/85 backdrop-blur-md border border-royalGold/60 px-6 py-3 rounded-full shadow-xl">
                <p class="font-cinzel text-xs sm:text-sm tracking-[0.28em] text-goldLight uppercase">Shubh Vivah • Royal Invitation</p>
            </div>

            <h1 id="gate-couple-names" class="font-script text-5xl sm:text-7xl gold-foil-light drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)] mb-8 px-2">
                Naga Dileep &amp; Mounika Naga Lakshmi Durga
            </h1>

            <!-- Interactive Golden Mandala Seal -->
            <button id="open-invitation-btn" aria-label="Open Royal Invitation"
                class="group relative w-36 h-36 sm:w-44 sm:h-44 rounded-full bg-gradient-to-br from-[#F7E08B] via-[#D4AF37] to-[#8C6214] p-1.5 seal-pulse cursor-pointer transition-transform duration-300 hover:scale-105 active:scale-95 shadow-[0_10px_40px_rgba(0,0,0,0.75)]">
                <div class="w-full h-full rounded-full bg-crimsonDeep border-2 border-goldLight flex flex-col items-center justify-center p-3 relative overflow-hidden">
                    <!-- Rotating Mandala Ring -->
                    <svg class="absolute inset-1 w-[calc(100%-8px)] h-[calc(100%-8px)] text-royalGold/40 animate-[spin_22s_linear_infinite]" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
                        <circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="1"/>
                        <polygon points="50,6 60,40 94,50 60,60 50,94 40,60 6,50 40,40" fill="none" stroke="currentColor" stroke-width="1"/>
                    </svg>
                    
                    <!-- Auspicious Om / Kalash Emblem -->
                    <span class="text-2xl sm:text-3xl text-goldLight mb-1 drop-shadow">ॐ</span>
                    <span class="font-cinzel text-[11px] sm:text-xs font-bold tracking-[0.18em] text-goldLight uppercase leading-tight">
                        Open Royal<br>Invitation
                    </span>
                </div>
            </button>

            <p class="mt-6 text-goldLight/85 font-cormorant italic text-base sm:text-lg tracking-wide">
                Tap the royal seal to enter the Mandap
            </p>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- FLOATING TOP CONTROLS (Music Toggle & Replay)                         -->
    <!-- ===================================================================== -->
    <header class="fixed top-0 inset-x-0 z-40 pointer-events-none px-3 py-3 sm:px-6 sm:py-4 flex items-center justify-between">
        <!-- Left: Music Toggle & Replay -->
        <div class="flex items-center gap-2 pointer-events-auto">
            <button id="music-toggle-btn" title="Toggle Auspicious Wedding Chimes"
                class="flex items-center gap-2 bg-crimsonDeep/90 hover:bg-crimson text-goldLight border border-royalGold/70 px-3.5 py-2 rounded-full shadow-lg backdrop-blur-md transition-all text-xs sm:text-sm font-sans font-medium cursor-pointer">
                <span id="music-icon" class="text-base">🔇</span>
                <span id="music-label" class="hidden sm:inline">Play Music</span>
            </button>

            <button id="replay-btn" title="Replay Grand Gate Opening"
                class="flex items-center gap-1.5 bg-ivory/95 hover:bg-white text-crimson border border-royalGold px-3.5 py-2 rounded-full shadow-lg backdrop-blur-md transition-all text-xs sm:text-sm font-sans font-medium cursor-pointer">
                <span>✨</span>
                <span class="hidden sm:inline">Replay</span>
            </button>
        </div>
    </header>

    <!-- MAIN INVITATION CONTENT                                               -->
    <!-- ===================================================================== -->

                            <path d="M676,175 Q690,162 704,175 L710,196 L670,196 Z" fill="url(#bellGlow)" stroke="#7E530A" stroke-width="1.2"/>
